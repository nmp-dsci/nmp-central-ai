[project]
name = "nmp-central-ai"
version = "0.1.0"
description = "Shared services platform (MLflow, Postgres, gateway) for the nmp-ai-portfolio projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mlflow-skinny>=3.16,<4",
  "pyyaml>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
  "mypy>=1.14",
  "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
