# nmp-central-ai — shared services for the nmp-ai-portfolio siblings.
#
#   make up          start everything (postgres, minio, mlflow, dbgate)
#   make langfuse-up start the Langfuse profile too (clickhouse, redis, web, worker)
#   make mlflow-init create every experiment in registry/projects.yaml
#   make status      health of the stack
#
# Siblings reach MLflow at http://localhost:5000 from the host, or at
# http://mlflow:5000 when their own compose stack joins the external
# network "nmp-central" (see docs/onboarding.md).
#
# Shape is deliberately the AWS shape: Postgres backend store + S3-API
# artifact store. In AWS the postgres and minio services are replaced by
# RDS and S3 via compose.aws.yml (M2); the mlflow service is unchanged.

# The live stack is project `nmp-central` on network `nmp-central` (what every
# sibling joins). A validation checkout — CI, a no-mistakes worktree — runs the
# same file under another project name, network and ports (see the Makefile),
# so its `down` can never stop the live stack. Never set these by hand.
name: ${COMPOSE_PROJECT_NAME:-nmp-central}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmp}
      POSTGRES_DB: ${POSTGRES_DB:-nmp}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    # D17: DataAgentBench's flags (2 813 tables, 6.6 GB) adopted for the whole cluster;
    # env-overridable so validation mode and any small host can dial them down.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c work_mem=${PG_WORK_MEM:-64MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      -c max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      -c checkpoint_timeout=15min
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
      # `make db-backup` / `db-restore` write and read dumps here (gitignored);
      # pg_restore -j needs a file, not stdin, so the directory is mounted.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nmp} -d ${POSTGRES_DB:-nmp}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO withdrew its public images (Docker Hub in 2026, then quay.io: anonymous pulls 401).
    # Chainguard builds the same server from source (amd64+arm64, same on-disk format, so the
    # existing volume is read as-is). Its free tier publishes only `latest`, so pin the digest;
    # bump it deliberately. This digest is MinIO RELEASE.2026-09-22T19-25-18Z.
    # Fallback if this goes away: rustfs/rustfs (S3-compatible, but a data migration).
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # the image runs as uid 65532; the volume was written as root by the old image
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    # the server image ships `mc` and a shell; chainguard/minio-client has no shell for the entrypoint
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_ARTIFACTS_BUCKET: ${MLFLOW_ARTIFACTS_BUCKET:-mlflow-artifacts}
      LANGFUSE_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MLFLOW_ARTIFACTS_BUCKET &&
      mc mb --ignore-existing local/$$LANGFUSE_BUCKET &&
      echo buckets ready: $$MLFLOW_ARTIFACTS_BUCKET $$LANGFUSE_BUCKET"

  mlflow:
    # Must run under uvicorn (the default): the OTLP ingest route /v1/traces lives in the
    # FastAPI app; passing --gunicorn-opts silently falls back to the Flask app and 404s it.
    build: ./services/mlflow
    image: nmp-central/mlflow:3.16.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@postgres:5432/mlflow
      --artifacts-destination s3://${MLFLOW_ARTIFACTS_BUCKET:-mlflow-artifacts}
      --serve-artifacts
      --workers 2
    environment:
      # MLflow's DNS-rebinding guard 403s any Host it does not know. Siblings reach us as
      # mlflow:5000 (compose network) or localhost:5000 (host); data-qa hit this once already.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,127.0.0.1,localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000},host.docker.internal,host.docker.internal:${MLFLOW_PORT:-5000}"
      # Siblings embed the trace view in their own explorers (DataAgentBench does); the
      # default SAMEORIGIN blocks the frame. Local only: every sibling is on this host.
      MLFLOW_SERVER_X_FRAME_OPTIONS: "NONE"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ap-southeast-2
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  dbgate:
    # Browse and query every project database from a browser (D20). Connections are NOT
    # configured here: `make db-init` renders .dbgate.env from the registry (one connection
    # per project database as nmp, fenced to that database) and restarts this service, since
    # DbGate reads its connection list once at start. Humans only; agents use `make db-psql`.
    image: dbgate/dbgate:7.3.0
    env_file:
      - path: .dbgate.env
        required: false   # first `make up` before `make db-init` still starts (empty sidebar)
    ports:
      # Host-only (D23): the UI holds the superuser identity, so it never leaves 127.0.0.1.
      - "127.0.0.1:${DBGATE_PORT:-5050}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships no wget/curl; node is what runs the app.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ---- Langfuse (profile `langfuse`; D33) ----------------------------------
  # GenAI observability: traces, cost, sessions, online eval. It does NOT replace
  # MLflow — runs, params, artifacts, prompts and the model registry stay there.
  #
  # Behind a compose profile so plain `make up` is unchanged: these four services
  # want ~5 GiB, and the Docker VM is currently 7.7 GiB with ~3.1 GiB already in
  # use. `make langfuse-up` starts them; raise Docker Desktop's memory first.
  #
  # Reuses the cluster Postgres (database `langfuse`, created by `make db-init`
  # from the registry — D13/D15) and the existing MinIO (bucket `langfuse`).
  # Only clickhouse and redis are genuinely new, and neither publishes a port:
  # ClickHouse's native port is 9000, which MinIO already owns on this host.
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    profiles: ["langfuse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
    # no `ports:` — internal only (see the 9000 clash above)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: docker.io/redis:7
    profiles: ["langfuse"]
    command: >
      --requirepass ${REDIS_AUTH:-redis}
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    # no `ports:` — only langfuse-web and langfuse-worker speak to it
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_AUTH:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["langfuse"]
    env_file:
      # generated by `make langfuse-init`: SALT, ENCRYPTION_KEY, NEXTAUTH_SECRET.
      # Gitignored — this is a public repo and these protect the API keys.
      - path: .langfuse.env
        required: false
    environment: &langfuse-env
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@postgres:5432/${LANGFUSE_DB:-langfuse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:-redis}
      # the same MinIO the artifact store uses, different bucket
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # local-only platform: no outbound product analytics
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3100}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: ["langfuse"]
    env_file:
      - path: .langfuse.env
        required: false
    environment:
      <<: *langfuse-env
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    ports:
      # Host-only, like the DB UI (D23): this console can read every project's
      # traces, so it never leaves 127.0.0.1.
      - "127.0.0.1:${LANGFUSE_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/public/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    name: ${PLATFORM_NETWORK:-nmp-central}

volumes:
  pgdata:
  miniodata:
  clickhousedata:
  clickhouselogs:
  redisdata:
