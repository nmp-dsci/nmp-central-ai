# nmp-central-ai — shared services for the nmp-ai-portfolio siblings.
#
#   make up          start everything (postgres, minio, mlflow)
#   make mlflow-init create every experiment in registry/projects.yaml
#   make status      health of the stack
#
# Siblings reach MLflow at http://localhost:5000 from the host, or at
# http://mlflow:5000 when their own compose stack joins the external
# network "nmp-central" (see docs/onboarding.md).
#
# Shape is deliberately the AWS shape: Postgres backend store + S3-API
# artifact store. In AWS the postgres and minio services are replaced by
# RDS and S3 via compose.aws.yml (M2); the mlflow service is unchanged.

name: nmp-central

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmp}
      POSTGRES_DB: ${POSTGRES_DB:-nmp}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nmp} -d ${POSTGRES_DB:-nmp}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO's Docker Hub repo was withdrawn in 2026; images are published on quay.io.
    # Pinned to the last hotfix build (April 2026). Fallback if this goes away: rustfs/rustfs.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_ARTIFACTS_BUCKET: ${MLFLOW_ARTIFACTS_BUCKET:-mlflow-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MLFLOW_ARTIFACTS_BUCKET &&
      echo bucket ready: $$MLFLOW_ARTIFACTS_BUCKET"

  mlflow:
    build: ./services/mlflow
    image: nmp-central/mlflow:3.16.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@postgres:5432/mlflow
      --artifacts-destination s3://${MLFLOW_ARTIFACTS_BUCKET:-mlflow-artifacts}
      --serve-artifacts
      --gunicorn-opts "--timeout 180 --workers 2"
    environment:
      # MLflow's DNS-rebinding guard 403s any Host it does not know. Siblings reach us as
      # mlflow:5000 (compose network) or localhost:5000 (host); data-qa hit this once already.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,127.0.0.1,localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000},host.docker.internal,host.docker.internal:${MLFLOW_PORT:-5000}"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ap-southeast-2
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    name: nmp-central

volumes:
  pgdata:
  miniodata:
