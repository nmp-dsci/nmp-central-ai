name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy scripts
      - run: uv run pytest -q
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # CI=true puts the Makefile in validation mode: project/network
      # nmp-central-validate on ports 15000/15432/19000/19001.
      - run: make mode && make up
      - run: uv sync && make mlflow-init
      - run: |
          set -a; source .mlflow-ids.env; set +a
          make otlp-smoke EXPERIMENT_ID="$MLFLOW_TRACE_EXPERIMENT_ID"
      - if: always()
        run: make logs-tail
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
